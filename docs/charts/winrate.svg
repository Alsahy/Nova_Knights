<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" width="760" height="324" role="img" aria-label="Mission Success by strategy (M3, 1000 games each)" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
